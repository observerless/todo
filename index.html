                                <div className="modal-box">
                                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:'15px'}}>
                                        <strong>습관 챌린지 설정</strong>
                                        <button className="btn" style={{padding:'2px 8px'}} onClick={() => setShowHabitModal(false)}>X</button>
                                    </div>
                                    <input placeholder="예: 물 한 컵 마시기" value={habitTitle} onChange={e => setHabitTitle(e.target.value)} />
                                    <div style={{marginTop:'10px'}}>챌린지 기간</div>
                                    <select value={habitGoal} onChange={e => setHabitGoal(Number(e.target.value))}>
                                        <option value={3}>3일</option><option value={7}>7일</option>
                                        <option value={14}>14일</option><option value={30}>30일</option>
                                    </select>
                                    <div style={{marginTop:'10px'}}>카테고리</div>
                                    <select value={habitCat} onChange={e => setHabitCat(e.target.value)}>
                                        {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <button className="btn" style={{width:'100%', marginTop:'20px'}} onClick={addHabit}>시작하기</button>
                                </div>
                            </div>
                        )}

                        {/* 🌟 할 일 수정 모달 🌟 */}
                        {editingTodoId && (
                            <div className="modal-overlay" style={{ zIndex: 150 }}>
                                <div className="modal-box">
                                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:'15px'}}>
                                        <strong>할 일 수정</strong>
                                        <button className="btn" style={{padding:'2px 8px'}} onClick={() => setEditingTodoId(null)}>X</button>
                                    </div>
                                    <input value={editTodoTitle} onChange={e => setEditTodoTitle(e.target.value)} />
                                    <div style={{marginTop:'10px', marginBottom: '5px', fontSize:'12px'}}>카테고리</div>
                                    <select value={editTodoCat} onChange={e => setEditTodoCat(e.target.value)}>
                                        {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <button className="btn" style={{width:'100%', marginTop:'20px'}} onClick={saveEditTodo}>저장</button>
                                </div>
                            </div>
                        )}

                        {/* 🌟 달력 날짜 클릭 시 나타나는 일정 모달 🌟 */}
                        {selectedCalDate && (
                            <div className="modal-overlay" style={{ zIndex: 150 }}>
                                <div className="modal-box">
                                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:'15px'}}>
                                        <strong>{selectedCalDate} 일정</strong>
                                        <button className="btn" style={{padding:'2px 8px'}} onClick={() => {triggerFeedback('click'); setSelectedCalDate(null)}}>X</button>
                                    </div>

                                    {calModalMode === 'view' && (
                                        <>
                                            <div style={{marginBottom:'20px', maxHeight: '200px', overflowY: 'auto'}}>
                                                {data.calendarEvents.filter(ev => selectedCalDate >= ev.startDate && selectedCalDate <= ev.endDate).map(ev => (
                                                    <div key={ev.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px', background:'rgba(0,0,0,0.05)', marginBottom:'4px', borderRadius:'4px'}}>
                                                        <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                                                            <div style={{width:'12px', height:'12px', backgroundColor:ev.color, borderRadius:'50%'}}></div>
                                                            <span style={{fontSize:'14px', wordBreak:'break-all'}}>{ev.title}</span>
                                                        </div>
                                                        {isEditableDate(selectedCalDate) && (
                                                            <button className="btn" style={{padding:'2px 6px', fontSize:'10px'}} onClick={() => deleteCalEvent(ev.id)}>삭제</button>
                                                        )}
                                                    </div>
                                                ))}
                                                {data.calendarEvents.filter(ev => selectedCalDate >= ev.startDate && selectedCalDate <= ev.endDate).length === 0 && (
                                                    <div style={{fontSize:'13px', opacity:0.6, textAlign:'center'}}>등록된 일정이 없습니다.</div>
                                                )}
                                            </div>

                                            {isEditableDate(selectedCalDate) ? (
                                                <button className="btn" style={{width:'100%', marginTop:'10px'}} onClick={() => { triggerFeedback('click'); setCalModalMode('add'); }}>+ 일정 추가하기</button>
                                            ) : (
                                                <div style={{fontSize:'12px', color:'#ff6b6b', textAlign:'center', marginTop:'15px'}}>
                                                    * 현재 게임 진행 기간(1일~30일) 외에는<br/>일정을 추가/삭제할 수 없습니다.
                                                </div>
                                            )}
                                        </>
                                    )}

                                    {calModalMode === 'add' && (
                                        <div>
                                            {isEditableDate(selectedCalDate) ? (
                                                <div style={{borderTop:'2px dashed var(--lcd-pixel)', paddingTop:'15px'}}>
                                                    <div style={{fontWeight:'bold', fontSize:'13px', marginBottom:'10px'}}>새 일정 추가</div>
                                                    <input placeholder="일정 내용" value={calEventTitle} onChange={e => setCalEventTitle(e.target.value)} />
                                                    <div style={{fontSize:'12px', marginBottom:'4px', marginTop:'5px'}}>종료일 (연속일정용)</div>
                                                    <input type="date" value={calEventEndDate} min={selectedCalDate} onChange={e => setCalEventEndDate(e.target.value)} style={{fontSize:'14px'}} />
                                                    
                                                    <div style={{fontSize:'12px', marginBottom:'4px', marginTop:'5px'}}>표시 색상</div>
                                                    <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                                                        {['#ff6b6b', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#5f27cd'].map(color => (
                                                            <div 
                                                                key={color} 
                                                                onClick={() => setCalEventColor(color)}
                                                                style={{
                                                                    width: '30px', height: '30px', borderRadius: '4px', backgroundColor: color,
                                                                    border: calEventColor === color ? '3px solid var(--lcd-pixel)' : '3px solid transparent',
                                                                    cursor: 'pointer',
                                                                    boxShadow: calEventColor === color ? 'inset 0 0 0 2px var(--lcd-bg)' : 'none'
                                                                }}
                                                            />
                                                        ))}
                                                    </div>

                                                    <button className="btn" style={{width:'100%', marginTop:'15px'}} onClick={() => {
                                                        addCalEvent();
                                                        setCalModalMode('view');
                                                    }}>저장</button>
                                                    <button className="btn" style={{width:'100%', marginTop:'5px', opacity: 0.7}} onClick={() => { triggerFeedback('click'); setCalModalMode('view'); }}>취소</button>
                                                </div>
                                            ) : (
                                                <div style={{fontSize:'12px', color:'#ff6b6b', textAlign:'center', marginTop:'15px'}}>
                                                    * 현재 게임 진행 기간(1일~30일) 외에는<br/>일정을 추가/삭제할 수 없습니다.
                                                    <button className="btn" style={{width:'100%', marginTop:'10px'}} onClick={() => setCalModalMode('view')}>뒤로</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        <div className="nav-bar">
                            <div className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => {triggerFeedback('click'); setTab('home');}}>홈</div>
                            <div className={`nav-item ${tab === 'todo' ? 'active' : ''}`} onClick={() => {triggerFeedback('click'); setTab('todo');}}>할일</div>
                            <div className={`nav-item ${tab === 'book' ? 'active' : ''}`} onClick={() => {triggerFeedback('click'); setTab('book');}}>도감</div>
                            <div className={`nav-item ${tab === 'setting' ? 'active' : ''}`} onClick={() => {triggerFeedback('click'); setTab('setting');}}>설정</div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
