<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#222222">
    <title>ToDoTchi</title>
    
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root { --device-bg: #e5e5e5; }
        /* 시간대별 테마 컬러 설정 */
        .theme-dawn { --lcd-bg: #325a5f; --lcd-pixel: #54a3a1; } /* 새벽: 새벽빛 배경, 밝은 텍스트 */
        .theme-morning { --lcd-bg: #8fa07d; --lcd-pixel: #3e4835; } /* 오전: 기존 초록, 기존 텍스트 */
        .theme-afternoon { --lcd-bg: #899b7f; --lcd-pixel: #2e3c10; } /* 오후: 짙은 초록, 밝은 텍스트 */
        .theme-night { --lcd-bg: #1f2d18; --lcd-pixel: #a1b590; } /* 밤: 더 짙은 초록, 밝은 텍스트 */

        * { box-sizing: border-box; font-family: 'Galmuri11', 'Courier New', monospace; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #222; display: flex; justify-content: center; align-items: center; overscroll-behavior-y: none; overflow: hidden; }
        #root { width: 100%; max-width: 420px; height: 100%; max-height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (max-width: 450px) { #root { max-width: 100%; } }

        .screen-bezel { flex: 1; background: var(--lcd-bg); display: flex; flex-direction: column; overflow: hidden; transition: background-color 1.5s; }
        .lcd-screen { flex: 1; background-color: transparent; color: var(--lcd-pixel); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: color 1.5s; }
        
        .panel { padding: 12px; border-bottom: 2px dashed var(--lcd-pixel); }
        .panel:last-child { border-bottom: none; }
        
        .btn { background: transparent; border: 2px solid var(--lcd-pixel); color: var(--lcd-pixel); padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.1s; border-radius: 4px; }
        .btn:active { background: var(--lcd-pixel); color: var(--lcd-bg); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        
        .header { padding: 12px 8px; text-align: center; font-size: 14px; font-weight: bold; background: var(--lcd-pixel); color: var(--lcd-bg); position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: center; transition: background-color 1.5s, color 1.5s; }
        .header-stats { display: flex; gap: 10px; font-size: 12px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .scrollable { flex: 1; overflow-y: auto; padding-bottom: 70px; scrollbar-width: none; }
        .scrollable::-webkit-scrollbar { display: none; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(3); } 50% { transform: translateY(-10px) scale(3); } }
        @keyframes tremble { 0%, 100% { margin-left: 0; } 50% { margin-left: -4px; } }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        
        .animate-bounce { animation: bounce 0.3s steps(2) infinite; }
        .animate-tremble { animation: tremble 0.2s steps(2) infinite; }
        .animate-pop { animation: pop 0.5s ease-out forwards; }

        .pixel-bubble { position: absolute; top: 90px; left: 50%; background: var(--lcd-bg); border: 2px solid var(--lcd-pixel); padding: 6px 10px; font-size: 12px; font-weight: bold; color: var(--lcd-pixel); white-space: nowrap; z-index: 10; pointer-events: none; transition: transform 0.3s, background-color 1.5s, color 1.5s, border-color 1.5s; }
        .pixel-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -4px; border-width: 4px 4px 0; border-style: solid; border-color: var(--lcd-pixel) transparent transparent transparent; }
        .pixel-bubble::before { content: ''; position: absolute; bottom: -3px; left: 50%; margin-left: -4px; border-width: 4px 4px 0; border-style: solid; border-color: var(--lcd-bg) transparent transparent transparent; z-index: 1; }
        
        input, select { width: 100%; padding: 12px 10px; border: 2px solid var(--lcd-pixel); background: var(--lcd-bg); color: var(--lcd-pixel); margin-bottom: 8px; outline: none; font-size: 15px; border-radius: 0; }
        input[type="date"] { font-family: sans-serif; }
        input:focus { background: var(--lcd-pixel); color: var(--lcd-bg); }
        
        .nav-bar { display: flex; border-top: 3px solid var(--lcd-pixel); background: var(--lcd-bg); position: absolute; bottom: 0; width: 100%; z-index: 10; transition: background-color 1.5s, border-color 1.5s; }
        .nav-item { flex: 1; text-align: center; padding: 18px 0; border-right: 3px solid var(--lcd-pixel); font-size: 14px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        .nav-item:last-child { border-right: none; }
        .nav-item.active { background: var(--lcd-pixel); color: var(--lcd-bg); }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; flex-direction: column; }
        .modal-box { background: var(--lcd-bg); border: 3px solid var(--lcd-pixel); padding: 20px; width: 100%; max-width: 340px; color: var(--lcd-pixel); box-shadow: 4px 4px 0px rgba(0,0,0,0.5); max-height: 90%; overflow-y: auto; }
        
        .item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .item-card { border: 2px solid var(--lcd-pixel); padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        
        .tag { padding: 2px 6px; font-size: 10px; border: 1px solid var(--lcd-pixel); display: inline-block; margin-bottom: 4px; }
        .event-banner { background: var(--lcd-pixel); color: var(--lcd-bg); padding: 10px; text-align: center; font-size: 13px; font-weight: bold; margin-bottom: 10px; border-radius: 4px; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SAVE_VERSION = 10; 
        const MAX_DAYS = 30;

        const getYYYYMMDD = (d) => {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };

        const STAT_NAMES = { int: '지능', str: '체력', emo: '감성', soc: '사교', life: '생활', dil: '성실', hap: '행복', fatigue: '피로' };
        const TYPE_NAMES = { normal: '노말', smart: '지식', macho: '마초', emo: '감성', social: '인싸' };
        const STAGE_NAMES = { egg: '알', baby: '아기', child: '어린이', teen: '청소년', adult: '어른', old: '어르신' };

        const CATEGORIES = {
            '공부': { int: 2, dil: 1, fatigue: 7 },
            '운동': { str: 2, dil: 1, fatigue: 10 },
            '취미': { emo: 2, hap: 2, fatigue: 3 },
            '사교': { soc: 2, hap: 2, fatigue: 5 },
            '생활': { life: 2, dil: 1, fatigue: 2 },
            '업무': { dil: 2, int: 1, fatigue: 8 },
            '휴식': { hap: 3, str: 1, fatigue: -20 },
        };

        const ALL_ITEMS = [
            { id: 'i_plant', name: '행운 화분', type: 'room', icon: '🪴', price: 100, rarity: 'COMMON' },
            { id: 'i_lamp', name: '스탠드', type: 'room', icon: '🏮', price: 150, rarity: 'COMMON' },
            { id: 'i_rug', name: '픽셀 러그', type: 'room', icon: '🟧', price: 200, rarity: 'COMMON' },
            { id: 'i_sofa', name: '픽셀 소파', type: 'room', icon: '🛋️', price: 300, rarity: 'RARE' },
            { id: 'i_tree', name: '미니 나무', type: 'room', icon: '🌳', price: 350, rarity: 'RARE' },
            { id: 'i_neon', name: '네온 램프', type: 'room', icon: '💡', price: 400, rarity: 'EPIC' },
            { id: 'i_bed', name: '포근 침대', type: 'room', icon: '🛏️', price: 450, rarity: 'EPIC' },
            { id: 'i_pc', name: '게이밍PC', type: 'room', icon: '💻', price: 600, rarity: 'LEGENDARY' },
            { id: 'i_tv', name: '브라운관TV',type: 'room', icon: '📺', price: 300, rarity: 'RARE' },
            { id: 'i_book', name: '책장', type: 'room', icon: '📚', price: 250, rarity: 'COMMON' },
            { id: 'i_ribbon', name: '빨간 리본', type: 'char', icon: '🎀', price: 150, rarity: 'COMMON' },
            { id: 'i_glasses',name: '안경', type: 'char', icon: '👓', price: 150, rarity: 'COMMON' },
            { id: 'i_sunglass',name: '선글라스', type: 'char', icon: '🕶️', price: 250, rarity: 'RARE' },
            { id: 'i_crown', name: '황금 왕관', type: 'char', icon: '👑', price: 500, rarity: 'LEGENDARY' },
            { id: 'i_hat', name: '야구 모자', type: 'char', icon: '🧢', price: 180, rarity: 'COMMON' },
            { id: 'i_headset', name: '헤드폰', type: 'char', icon: '🎧', price: 320, rarity: 'EPIC' },
            { id: 'i_neck', name: '금목걸이', type: 'char', icon: '📿', price: 350, rarity: 'EPIC' },
            { id: 'i_bag', name: '가방', type: 'char', icon: '🎒', price: 200, rarity: 'RARE' },
            { id: 'i_band', name: '운동 밴드', type: 'char', icon: '🥋', price: 220, rarity: 'RARE' },
            { id: 'i_magic', name: '마법 지팡이',type: 'char', icon: '🪄', price: 700, rarity: 'LEGENDARY' }
        ];

        const ENDINGS = [
            // 🌟 위대한 영웅 엔딩 업데이트 🌟
            { 
                id: 'e_hero', 
                name: '위대한 영웅', 
                desc: '매일 할 일 2개 이상 & 누적 65개 이상 완료 및 단 한 번도 포기(삭제) 안 함!', 
                condition: (s, a, data) => {
                    const totalCompleted = Object.values(a).reduce((sum, val) => sum + val, 0);
                    return totalCompleted >= 65 && !data.hasDeletedTodo && data.todos.length === 0 && !data.failedDailyMinTasks;
                }, 
                story: "당신은 자신이 내뱉은 말은 무조건 지키는 진짜 영웅입니다!\n단 한 번의 포기(삭제)도 없이 매일 꾸준히, 총 65개 이상의 할 일을 끝까지 해냈습니다.\n이 픽셀 세계에서 가장 꺾이지 않는 굳건한 의지의 소유자입니다." 
            },
            { id: 'e_insider', name: '슈퍼 인싸', desc: '사교 활동을 20회 이상 달성!', condition: (s, a) => a['사교'] >= 20, story: "당신의 캘린더는 쉴 틈이 없습니다.\n어딜 가든 사람들이 당신을 찾고 붐비는 파티의 중심엔 항상 당신이 있죠.\n픽셀 세계 최고의 마당발이 되었습니다!" },
            { id: 'e_gymrat', name: '운동광', desc: '운동 활동을 20회 이상 달성!', condition: (s, a) => a['운동'] >= 20, story: "3대 500은 기본!\n비가 오나 눈이 오나 헬스장을 출석한 결과, 거대한 근육 덩어리가 되었습니다.\n프로틴 쉐이크 건배!" },
            { id: 'e_workaholic', name: '일 중독', desc: '업무를 20회 이상 달성!', condition: (s, a) => a['업무'] >= 20, story: "워라밸이 뭔가요?\n당신은 완벽한 커리어를 위해 밤낮없이 일했습니다.\n통장 잔고는 넉넉하지만 눈밑 다크서클이 짙네요." },
            { id: 'e_restgod', name: '휴식의 신', desc: '휴식을 20회 이상 달성!', condition: (s, a) => a['휴식'] >= 20, story: "아무것도 안 하는 것의 위대함!\n당신은 극강의 칠링(Chilling) 마스터가 되었습니다.\n세상에서 가장 평화로운 픽셀이 여깄네요." },
            { id: 'e_collector', name: '수집가', desc: '아이템을 15개 이상 수집!', condition: (s, a, data) => data.inventory.length + data.equippedItems.length >= 15, story: "물욕의 화신!\n상점의 모든 물건을 사들인 당신의 방은 발 디딜 틈이 없습니다.\n가장 화려한 방을 꾸몄네요!" },
            { id: 'e_perfect', name: '완벽한 인생', desc: '모든 스탯 80 이상.', condition: s => Object.values(s).every(v => v >= 80), story: "모든 것을 이룬 전설의 캐릭터.\n지, 덕, 체를 모두 갖춘 육각형 인간의 표본입니다." },
            { id: 'e_sage', name: '현자', desc: '세상의 이치를 깨달았습니다.', condition: s => s.int >= 85 && s.emo >= 70 && s.hap >= 70, story: "지식과 감성의 완벽한 조화.\n사람들은 당신에게 삶의 조언을 구하러 찾아옵니다." },
            { id: 'e_martial', name: '무림고수', desc: '속세를 떠나 무공 연마.', condition: s => s.str >= 85 && s.dil >= 90 && s.soc < 30, story: "사람들과 어울리는 대신 주먹을 쥐고 허공을 가릅니다.\n한계를 초월한 고수가 되었습니다." },
            { id: 'e_freak', name: '괴짜 천재', desc: '자기만의 세계에 빠진 천재.', condition: s => s.int >= 80 && s.emo >= 90 && s.soc < 30, story: "이해할 수 없는 공식을 휘갈기며 우주의 진리를 탐구합니다.\n외롭지만 빛나는 고독 속의 천재." },
            { id: 'e_bed', name: '침대 껌딱지', desc: '이불 밖은 위험해.', condition: s => s.dil < 20 && s.str < 30, story: "근육은 녹아내렸지만 침대 위 평화는 영원합니다.\n이불과 한 몸이 되었습니다." },
            { id: 'e_normal', name: '평범한 시민', desc: '오늘도 묵묵히 살아갑니다.', condition: () => true, story: "적당히 일하고 적당히 쉬며 평범하게 30일을 보냈습니다.\n이런 평범한 사람들이 세상을 지탱합니다." }
        ];

        const DAILY_MISSIONS = [
            { id: 'm1', title: '할 일 3개 완료하기', target: 3, rewardText: '행복 +3, 30G', onComplete: (d) => { d.stats.hap = Math.min(100, d.stats.hap+3); d.coins+=30; } },
            { id: 'm2', title: '공부 1회 완료', target: 1, rewardText: '지능 +2, 30G', onComplete: (d) => { d.stats.int = Math.min(100, d.stats.int+2); d.coins+=30; } },
            { id: 'm3', title: '운동 1회 완료', target: 1, rewardText: '체력 +2, 30G', onComplete: (d) => { d.stats.str = Math.min(100, d.stats.str+2); d.coins+=30; } },
            { id: 'm4', title: '휴식 1회 완료', target: 1, rewardText: '피로 -15, 30G', onComplete: (d) => { d.fatigue = Math.max(0, d.fatigue-15); d.coins+=30; } },
            { id: 'm5', title: '습관 1회 체크', target: 1, rewardText: '성실 +2, 50G', onComplete: (d) => { d.stats.dil = Math.min(100, d.stats.dil+2); d.coins+=50; } },
        ];

        const RANDOM_EVENTS = [
            { id: 'ev_lucky', title: '행운의 날 🍀', desc: '오늘은 왠지 운이 좋습니다! 코인을 발견했습니다.', apply: d => { d.coins += 50; } },
            { id: 'ev_tired', title: '갑작스러운 피로 🥱', desc: '몸이 찌뿌둥합니다. 피로도가 증가했습니다.', apply: d => { d.fatigue = Math.min(100, d.fatigue + 20); } },
            { id: 'ev_snack', title: '간식 발견! 🍩', desc: '냉장고에서 맛있는 걸 발견했습니다. 행복이 오릅니다.', apply: d => { d.stats.hap = Math.min(100, d.stats.hap + 15); } },
            { id: 'ev_rain', title: '비 오는 날 ☔', desc: '차분한 하루입니다. 감성이 풍부해집니다.', apply: d => { d.stats.emo = Math.min(100, d.stats.emo + 10); } },
        ];

        const getStage = (day) => {
            if (day <= 2) return 'egg';
            if (day <= 6) return 'baby';
            if (day <= 14) return 'child';
            if (day <= 22) return 'teen';
            return 'adult';
        };

        // --- Audio & Haptics ---
        let audioCtx = null;
        const playSound = (type) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                if (type === 'click') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'success' || type === 'coin') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'sick' || type === 'penalty') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'evolve') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.3);
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e) { }
        };
        const vibrate = (ms = 50) => { if (navigator.vibrate) navigator.vibrate(ms); };
        const triggerFeedback = (type) => { playSound(type); vibrate(type==='success'?[30,50,30]:50); };

        const ProgressBar = ({ label, value, colorClass = "" }) => {
            const filledBlocks = Math.floor(value / 10);
            const blocks = Array.from({ length: 10 }, (_, i) => i < filledBlocks);
            return (
                <div style={{ display: 'flex', flexDirection: 'column', marginBottom: '10px' }}>
                    <div style={{ fontSize: '11px', marginBottom: '4px', fontWeight: 'bold' }}>{label}({value}/100)</div>
                    <div className={colorClass} style={{ display: 'flex', gap: '2px', border: '2px solid var(--lcd-pixel)', padding: '2px', height: '14px', width: '100%' }}>
                        {blocks.map((filled, idx) => (
                            <div key={idx} style={{ flex: 1, backgroundColor: filled ? 'var(--lcd-pixel)' : 'transparent' }} />
                        ))}
                    </div>
                </div>
            );
        };

        const drawFace = (x, y, face, bg) => {
            if (face === 'happy') return <g fill={bg}><rect x={x} y={y} width="2" height="1"/><rect x={x+6} y={y} width="2" height="1"/><rect x={x+2} y={y+2} width="4" height="2"/></g>;
            if (face === 'sad') return <g fill={bg}><rect x={x} y={y+1} width="2" height="2"/><rect x={x+6} y={y+1} width="2" height="2"/><rect x={x+3} y={y+3} width="2" height="2"/></g>;
            if (face === 'sleepy') return <g fill={bg}><rect x={x} y={y+1} width="2" height="1"/><rect x={x+6} y={y+1} width="2" height="1"/><rect x={x+3} y={y+3} width="2" height="1"/></g>;
            if (face === 'sleeping') return <g fill={bg}><rect x={x-1} y={y+1} width="4" height="1"/><rect x={x+5} y={y+1} width="4" height="1"/></g>;
            return <g fill={bg}><rect x={x} y={y} width="2" height="3"/><rect x={x+6} y={y} width="2" height="3"/><rect x={x+2} y={y+4} width="4" height="1"/></g>;
        };

        const renderCharacter = (stage, charType, face, action, charItems, px, bg) => {
            let bodySvg = null;

            if (stage === 'egg') {
                bodySvg = <g><rect x="7" y="10" width="10" height="10" /><rect x="9" y="8" width="6" height="2" /><rect x="9" y="20" width="6" height="2" /><rect x="5" y="12" width="2" height="6" /><rect x="17" y="12" width="2" height="6" /><rect x="11" y="14" width="2" height="2" fill={bg} /></g>;
            } else if (stage === 'baby') {
                bodySvg = <g><rect x="7" y="12" width="10" height="8" /><rect x="9" y="10" width="6" height="2" /><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" />{drawFace(8, 13, face, bg)}</g>;
            } else if (stage === 'old') {
                bodySvg = <g><rect x="6" y="10" width="12" height="10" /><rect x="8" y="8" width="8" height="2" /><rect x="10" y="4" width="4" height="4" /><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" />{drawFace(8, 13, face, bg)}</g>;
            } 
            else if (charType === 'smart') {
                if (stage === 'child') bodySvg = <g><rect x="7" y="10" width="10" height="10" /><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" /><rect x="5" y="11" width="5" height="5" fill="none" stroke={bg}/><rect x="14" y="11" width="5" height="5" fill="none" stroke={bg}/><rect x="10" y="13" width="4" height="1" fill={bg}/>{drawFace(8, 12, face, bg)}</g>;
                if (stage === 'teen') bodySvg = <g><rect x="6" y="8" width="12" height="12" /><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" /><rect x="4" y="9" width="6" height="6" fill="none" stroke={bg}/><rect x="14" y="9" width="6" height="6" fill="none" stroke={bg}/><rect x="10" y="11" width="4" height="1" fill={bg}/><rect x="17" y="13" width="5" height="6" fill={bg}/><rect x="18" y="14" width="3" height="4" fill={px}/>{drawFace(8, 10, face, bg)}</g>;
                if (stage === 'adult') bodySvg = <g><rect x="6" y="6" width="12" height="14" /><rect x="4" y="8" width="16" height="10" /><rect x="2" y="4" width="20" height="2"/><rect x="7" y="2" width="10" height="2"/><rect x="20" y="4" width="1" height="6"/><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" /><rect x="4" y="10" width="6" height="5" fill="none" stroke={bg}/><rect x="14" y="10" width="6" height="5" fill="none" stroke={bg}/><rect x="10" y="12" width="4" height="1" fill={bg}/>{drawFace(8, 11, face, bg)}</g>;
            } else if (charType === 'macho') {
                if (stage === 'child') bodySvg = <g><rect x="6" y="10" width="12" height="10" /><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" /><rect x="6" y="11" width="3" height="1" fill={bg}/><rect x="15" y="11" width="3" height="1" fill={bg}/>{drawFace(8, 13, face, bg)}</g>;
                if (stage === 'teen') bodySvg = <g><rect x="5" y="8" width="14" height="12" /><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" /><rect x="2" y="12" width="4" height="4"/><rect x="18" y="12" width="4" height="4"/>{drawFace(8, 11, face, bg)}</g>;
                if (stage === 'adult') bodySvg = <g><rect x="4" y="6" width="16" height="14" /><rect x="2" y="8" width="20" height="8" /><rect x="7" y="20" width="3" height="2" /><rect x="14" y="20" width="3" height="2" /><rect x="7" y="14" width="10" height="5" fill="none" stroke={bg}/><rect x="12" y="14" width="1" height="5" fill={bg}/><rect x="7" y="16" width="10" height="1" fill={bg}/>{drawFace(8, 9, face, bg)}</g>;
            } else if (charType === 'emo') {
                if (stage === 'child') bodySvg = <g><rect x="5" y="12" width="14" height="8" rx="3"/><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" />{drawFace(8, 14, face, bg)}</g>;
                if (stage === 'teen') bodySvg = <g><rect x="4" y="10" width="16" height="10" rx="4"/><rect x="5" y="6" width="3" height="5"/><rect x="16" y="6" width="3" height="5"/><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" />{drawFace(8, 12, face, bg)}</g>;
                if (stage === 'adult') bodySvg = <g><rect x="3" y="8" width="18" height="12" rx="5"/><rect x="4" y="4" width="4" height="6"/><rect x="16" y="4" width="4" height="6"/><rect x="19" y="15" width="5" height="3" rx="1"/><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" />{drawFace(8, 11, face, bg)}</g>;
            } else if (charType === 'social') {
                if (stage === 'child') bodySvg = <g><rect x="7" y="10" width="10" height="10" /><rect x="8" y="20" width="2" height="2" /><rect x="14" y="20" width="2" height="2" /><rect x="11" y="6" width="3" height="4"/><rect x="14" y="7" width="2" height="3"/>{drawFace(8, 12, face, bg)}</g>;
                if (stage === 'teen') bodySvg = <g><rect x="6" y="8" width="12" height="12" /><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" /><rect x="3" y="9" width="3" height="6"/><rect x="18" y="9" width="3" height="6"/><rect x="5" y="6" width="14" height="3"/>{drawFace(8, 11, face, bg)}</g>;
                if (stage === 'adult') bodySvg = <g><rect x="6" y="6" width="12" height="14" /><rect x="4" y="8" width="16" height="10" /><rect x="7" y="20" width="3" height="2" /><rect x="14" y="20" width="3" height="2" /><rect x="6" y="2" width="2" height="4"/><rect x="10" y="0" width="2" height="6"/><rect x="14" y="1" width="2" height="5"/><rect x="18" y="4" width="2" height="4"/><rect x="6" y="9" width="12" height="4" fill={bg}/><rect x="7" y="10" width="10" height="2" fill={px}/>{face!=='sleeping' && drawFace(8,11,face,bg)}</g>;
            } else {
                if (stage === 'child') bodySvg = <g><rect x="7" y="10" width="10" height="10" /><rect x="9" y="8" width="6" height="2" /><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" />{drawFace(8, 12, face, bg)}</g>;
                if (stage === 'teen') bodySvg = <g><rect x="6" y="8" width="12" height="12" /><rect x="8" y="6" width="8" height="2" /><rect x="8" y="20" width="2" height="3" /><rect x="14" y="20" width="2" height="3" />{drawFace(8, 10, face, bg)}</g>;
                if (stage === 'adult') bodySvg = <g><rect x="6" y="6" width="12" height="14" /><rect x="4" y="8" width="16" height="10" /><rect x="7" y="20" width="3" height="2" /><rect x="14" y="20" width="3" height="2" />{drawFace(8, 10, face, bg)}</g>;
            }

            return (
                <g fill={px}>
                    {bodySvg}
                    
                    {action === 'eat' && <g><rect x="18" y="16" width="6" height="3" fill={px} /><rect x="19" y="15" width="4" height="1" fill={bg} /><rect x="21" y="13" width="1" height="5" fill={px} /></g>}
                    {action === 'study' && <g fill={px}><rect x="16" y="18" width="8" height="4" /><rect x="17" y="19" width="6" height="2" fill={bg} /><rect x="19" y="18" width="2" height="4" fill={px} /></g>}
                    {action === 'wash' && <g fill={px}><rect x="2" y="8" width="3" height="3" fill="none" stroke={px} strokeWidth="1" /><rect x="18" y="6" width="2" height="2" fill="none" stroke={px} strokeWidth="1" /><rect x="16" y="10" width="4" height="4" fill="none" stroke={px} strokeWidth="1" /><rect x="4" y="16" width="2" height="2" fill="none" stroke={px} strokeWidth="1" /></g>}
                    {action === 'sleep' && <g fill={px}>
                        <rect x="15" y="8" width="3" height="1"/><rect x="17" y="9" width="1" height="1"/><rect x="16" y="10" width="1" height="1"/><rect x="15" y="11" width="3" height="1"/>
                        <rect x="20" y="3" width="4" height="1"/><rect x="23" y="4" width="1" height="1"/><rect x="22" y="5" width="1" height="1"/><rect x="21" y="6" width="1" height="1"/><rect x="20" y="7" width="4" height="1"/>
                    </g>}

                    {charItems && charItems.map((item, idx) => {
                        if(item.id==='i_glasses') return <g key={idx} fill={bg}><rect x="7" y="9" width="4" height="5" fill="none" stroke={px} strokeWidth="1" /><rect x="13" y="9" width="4" height="5" fill="none" stroke={px} strokeWidth="1" /><rect x="11" y="10" width="2" height="1" fill={px} /></g>;
                        if(item.id==='i_sunglass') return <g key={idx} fill={px}><rect x="6" y="9" width="5" height="4" /><rect x="13" y="9" width="5" height="4" /><rect x="11" y="10" width="2" height="1"/></g>;
                        if(item.id==='i_crown') return <g key={idx}><rect x="10" y="1" width="4" height="2" /><rect x="8" y="3" width="8" height="2" /></g>;
                        if(item.id==='i_ribbon') return <g key={idx}><rect x="16" y="2" width="3" height="3" /><rect x="19" y="0" width="3" height="3" /><rect x="19" y="4" width="3" height="3" /></g>;
                        return null;
                    })}
                </g>
            );
        };

        const RoomComponent = ({ data, isAnimating, action, speech, timeZone }) => {
            const [charPos, setCharPos] = useState(0);
            const [isJumping, setIsJumping] = useState(false);
            
            const stage = getStage(data.day);
            const charType = data.charType || 'normal';

            const hasDesk = data.stats.int > 70;
            const hasDumbbell = data.stats.str > 70;
            const isClean = data.stats.life > 70;
            const hasFriends = data.stats.soc > 70;
            const isSick = data.isSick;

            let face = data.stats.hap > 80 ? 'happy' : data.stats.hap < 30 ? 'sad' : 'normal';
            if (data.fatigue >= 60) face = 'sleepy';
            if (isSick) face = 'sad';
            if (action === 'eat' || action === 'wash') face = 'happy';
            if (action === 'study') face = 'normal';
            if (action === 'sleep') face = 'sleeping';

            const bgMap = { 'dawn':'#325a5f', 'morning':'#8fa07d', 'afternoon':'#899b7f', 'night':'#1f2d18' };
            const pxMap = { 'dawn':'#54a3a1', 'morning':'#3e4835', 'afternoon':'#2e3c10', 'night':'#a1b590' };
            const bg = bgMap[timeZone] || '#8fa07d';
            const px = pxMap[timeZone] || '#3e4835';

            useEffect(() => {
                const moveInterval = setInterval(() => {
                    if (Math.random() < 0.4 && !isSick && data.fatigue < 80 && action !== 'sleep') setCharPos(Math.floor(Math.random() * 100) - 50);
                }, 4000);
                return () => clearInterval(moveInterval);
            }, [isSick, data.fatigue, action]);

            const handleJump = () => {
                if (isJumping || data.fatigue >= 90 || isSick || action === 'sleep') return;
                triggerFeedback('click');
                setIsJumping(true);
                setTimeout(() => setIsJumping(false), 300);
            };

            const roomItems = data.equippedItems.filter(i => i.type === 'room');
            const charItems = data.equippedItems.filter(i => i.type === 'char');

            let bubbleSpeech = speech;
            if (action === 'eat') bubbleSpeech = "냠냠 쩝쩝!";
            else if (action === 'study') bubbleSpeech = "열공 중... ✏️";
            else if (action === 'wash') bubbleSpeech = "뽀득뽀득~ 🫧";
            else if (action === 'sleep') bubbleSpeech = "쿨쿨... 💤";
            else if (action === 'heal') bubbleSpeech = "살 것 같다! 💊";

            const animClass = isAnimating ? 'animate-bounce' : (isSick || data.fatigue >= 80 ? 'animate-tremble' : '');

            return (
                <div style={{ position: 'relative', width: '100%', height: '200px', borderBottom: `3px solid ${px}`, overflow: 'hidden', flexShrink: 0 }}>
                    {bubbleSpeech && <div className="pixel-bubble" style={{ transform: `translateX(calc(-50% + ${charPos}px))` }}>{bubbleSpeech}</div>}
                    
                    <svg width="100%" height="100%" viewBox="0 0 64 64" preserveAspectRatio="none" style={{ shapeRendering: 'crispEdges' }}>
                        <rect x="0" y="50" width="64" height="1" fill={px} />
                        {!isClean && <rect x="10" y="55" width="2" height="1" fill={px} />}
                        
                        <g fill="none" stroke={px} strokeWidth="1">
                            <defs>
                                <clipPath id="win-clip"><rect x="5" y="5" width="16" height="16" /></clipPath>
                            </defs>
                            
                            <rect x="5" y="5" width="16" height="16" fill={(timeZone === 'dawn' || timeZone === 'night') ? px : bg}/>
                            
                            <g clipPath="url(#win-clip)" stroke="none">
                                {(timeZone === 'dawn' || timeZone === 'night') && (
                                    <g fill={bg}>
                                        <rect x="7" y="7" width="1" height="1" />
                                        <rect x="17" y="9" width="1" height="1" />
                                        <rect x="10" y="13" width="1" height="1" />
                                        <rect x="14" y="17" width="1" height="1" />
                                        <rect x="18" y="15" width="1" height="1" />
                                        <rect x="8" y="18" width="1" height="1" />
                                    </g>
                                )}
                                
                                {timeZone === 'night' && (
                                    <g fill={bg}>
                                        <rect x="14" y="6" width="4" height="4" />
                                        <rect x="13" y="7" width="3" height="3" fill={px} />
                                    </g>
                                )}

                                {(timeZone === 'morning' || timeZone === 'afternoon') && (() => {
                                    const now = new Date();
                                    const ch = now.getHours() + now.getMinutes() / 60;
                                    let sunY = 13;
                                    if (timeZone === 'morning') {
                                        const ratio = Math.max(0, Math.min(1, (ch - 7) / 5));
                                        sunY = 19 - (12 * ratio);
                                    } else {
                                        const ratio = Math.max(0, Math.min(1, (ch - 12) / 6));
                                        sunY = 7 + (12 * ratio);
                                    }
                                    return <rect x="11" y={sunY} width="4" height="4" fill={px} />;
                                })()}

                                {(timeZone === 'morning' || timeZone === 'afternoon') && (
                                    <g fill={px}>
                                        <rect y="8" width="6" height="2">
                                            <animate attributeName="x" from="21" to="-6" dur="18s" repeatCount="indefinite" />
                                        </rect>
                                        <rect y="13" width="4" height="2">
                                            <animate attributeName="x" from="21" to="-4" dur="12s" repeatCount="indefinite" />
                                        </rect>
                                        <rect y="17" width="5" height="2">
                                            <animate attributeName="x" from="21" to="-5" dur="22s" repeatCount="indefinite" />
                                        </rect>
                                    </g>
                                )}
                            </g>
                            
                            <g fill={(timeZone === 'dawn' || timeZone === 'night') ? bg : px} stroke="none">
                                <rect x="5" y="12" width="16" height="1" />
                                <rect x="12" y="5" width="1" height="16" />
                            </g>
                        </g>

                        {roomItems.map((item, idx) => (
                            <text key={item.id} x={25 + (idx%3)*12} y={48 - Math.floor(idx/3)*10} fontSize="10">{item.icon}</text>
                        ))}

                        {hasDesk && stage !== 'egg' && <g fill={px}><rect x="44" y="36" width="16" height="1" /><rect x="46" y="37" width="2" height="13" /><rect x="56" y="37" width="2" height="13" /></g>}
                        {hasDumbbell && stage !== 'egg' && <g fill={px}><rect x="6" y="46" width="8" height="1" /><rect x="4" y="44" width="2" height="5" /><rect x="14" y="44" width="2" height="5" /></g>}
                        {hasFriends && stage !== 'egg' && <text x="50" y="25" fontSize="10">👥</text>}
                        {isSick && <g fill={px}><rect x="45" y="10" width="8" height="2" /><rect x="48" y="7" width="2" height="8" /></g>}
                    </svg>

                    <div className={isJumping ? 'animate-bounce' : animClass}
                         onClick={handleJump}
                         style={{ position: 'absolute', bottom: '14%', left: '50%', transform: `translateX(calc(-50% + ${charPos}px)) scale(3)`, transition: 'transform 1.5s ease-in-out', transformOrigin: 'bottom center', width: '24px', height: '24px', imageRendering: 'pixelated', cursor: 'pointer' }}>
                        <svg width="100%" height="100%" viewBox="0 0 24 24" style={{ shapeRendering: 'crispEdges' }}>
                            {renderCharacter(stage, charType, face, action, charItems, px, bg)}
                        </svg>
                    </div>
                </div>
            );
        };

        const TodoItem = ({ t, onComplete, onDelete, onEdit }) => {
            const [offsetX, setOffset] = useState(0);
            const startX = useRef(0);
            const startY = useRef(0);
            const isSwiping = useRef(false);
            const pressTimer = useRef(null);

            const handlePointerDown = (e) => {
                startX.current = e.clientX;
                startY.current = e.clientY;
                isSwiping.current = true;
                e.target.setPointerCapture(e.pointerId);
                
                pressTimer.current = setTimeout(() => {
                    if(isSwiping.current) {
                        isSwiping.current = false;
                        setOffset(0);
                        triggerFeedback('success');
                        onEdit(t);
                    }
                }, 600);
            };

            const handlePointerMove = (e) => {
                if (!isSwiping.current) return;
                const diffX = e.clientX - startX.current;
                const diffY = e.clientY - startY.current;
                
                if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
                    clearTimeout(pressTimer.current);
                }
                
                if (diffX < 0 && Math.abs(diffX) > Math.abs(diffY)) {
                    setOffset(Math.max(diffX, -80));
                }
            };

            const handlePointerUp = (e) => {
                clearTimeout(pressTimer.current);
                if (!isSwiping.current) return;
                isSwiping.current = false;
                if (offsetX <= -50) {
                    onDelete(t.id);
                } else {
                    setOffset(0);
                }
            };

            return (
                <div style={{ position: 'relative', marginBottom: '6px' }}>
                    <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: '80px', backgroundColor: '#ff6b6b', borderRadius: '4px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: '13px', fontWeight: 'bold' }}>
                        삭제
                    </div>
                    <div 
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerCancel={handlePointerUp}
                        style={{ 
                            position: 'relative',
                            display: 'flex', justifyContent: 'space-between', alignItems: 'center', 
                            padding: '10px', borderRadius: '4px',
                            backgroundColor: 'var(--lcd-bg)',
                            borderBottom: '2px dashed var(--lcd-pixel)',
                            transform: `translateX(${offsetX}px)`,
                            transition: isSwiping.current ? 'none' : 'transform 0.2s ease-out',
                            zIndex: 2,
                            touchAction: 'pan-y',
                            userSelect: 'none'
                        }}>
                        <div style={{ textDecoration: t.isDone ? 'line-through' : 'none', opacity: t.isDone ? 0.5 : 1, flex: 1 }}>
                            <span className="tag">{t.category}</span>
                            <div style={{ fontSize: '14px' }}>{t.title}</div>
                        </div>
                        {!t.isDone && <button className="btn" onPointerDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onComplete(t.id); }}>완료</button>}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('todotchi_save');
                    if (saved) {
                        let parsed = JSON.parse(saved);
                        if (!parsed.calendarEvents) parsed.calendarEvents = [];
                        if (!parsed.gameStartDate) parsed.gameStartDate = getYYYYMMDD(new Date());
                        if (parsed.hasDeletedTodo === undefined) parsed.hasDeletedTodo = false;
                        if (parsed.totalCreatedTodos === undefined) parsed.totalCreatedTodos = 0;
                        if (parsed.failedDailyMinTasks === undefined) parsed.failedDailyMinTasks = false;
                        if (parsed.todayCompletedCount === undefined) parsed.todayCompletedCount = 0;
                        return parsed;
                    }
                } catch(e) {}
                
                return {
                    version: SAVE_VERSION, name: '', day: 1, 
                    charType: 'normal',
                    stats: { int: 10, str: 10, emo: 10, soc: 10, life: 10, dil: 10, hap: 50 },
                    fatigue: 0, coins: 0, combo: 0, bestCombo: 0,
                    todos: [], habits: [], inventory: [], equippedItems: [], encyclopedia: [],
                    actionCounts: { 공부:0, 운동:0, 취미:0, 사교:0, 생활:0, 업무:0, 휴식:0 },
                    dailyMission: null, dailyMissionCompleted: false,
                    lastDate: new Date().toDateString(), isSick: false, firstPlay: true, randomEvent: null,
                    showEvolution: null,
                    calendarEvents: [], gameStartDate: getYYYYMMDD(new Date()),
                    hasDeletedTodo: false, totalCreatedTodos: 0,
                    failedDailyMinTasks: false, todayCompletedCount: 0
                };
            });

            const [tab, setTab] = useState('home');
            const [subTab, setSubTab] = useState('shop');
            const [todoTab, setTodoTab] = useState('today'); 
            
            const [isAnimating, setIsAnimating] = useState(false);
            const [action, setAction] = useState(null); 
            const [bubbleText, setBubbleText] = useState('');
            const [timeZone, setTimeZone] = useState('morning');
            
            const [newTodoTitle, setNewTodoTitle] = useState('');
            const [newTodoCat, setNewTodoCat] = useState('공부');

            const [editingTodoId, setEditingTodoId] = useState(null);
            const [editTodoTitle, setEditTodoTitle] = useState('');
            const [editTodoCat, setEditTodoCat] = useState('');
            
            const [showHabitModal, setShowHabitModal] = useState(false);
            const [habitTitle, setHabitTitle] = useState('');
            const [habitGoal, setHabitGoal] = useState(7);
            const [habitCat, setHabitCat] = useState('공부');

            const [showSummary, setShowSummary] = useState(false);
            const [summaryData, setSummaryData] = useState(null);
            const [ending, setEnding] = useState(null);

            const [calYear, setCalYear] = useState(new Date().getFullYear());
            const [calMonth, setCalMonth] = useState(new Date().getMonth() + 1); 
            const [calZoom, setCalZoom] = useState(1);
            const calRef = useRef(null);
            const baseZoomRef = useRef(calZoom);

            const [calModalMode, setCalModalMode] = useState('view');
            const [selectedCalDate, setSelectedCalDate] = useState(null);
            const [calEventTitle, setCalEventTitle] = useState('');
            const [calEventEndDate, setCalEventEndDate] = useState('');
            const [calEventColor, setCalEventColor] = useState('#ff6b6b');

            const bgMap = { 'dawn':'#325a5f', 'morning':'#8fa07d', 'afternoon':'#899b7f', 'night':'#1f2d18' };
            const pxMap = { 'dawn':'#54a3a1', 'morning':'#3e4835', 'afternoon':'#2e3c10', 'night':'#a1b590' };
            const bg = bgMap[timeZone] || '#8fa07d';
            const px = pxMap[timeZone] || '#3e4835';

            useEffect(() => {
                if (data.showEvolution) {
                    triggerFeedback('evolve');
                }
            }, [data.showEvolution]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const h = new Date().getHours();
                    let tz = 'morning';
                    if (h >= 1 && h < 7) tz = 'dawn';
                    else if (h >= 7 && h < 12) tz = 'morning';
                    else if (h >= 12 && h < 18) tz = 'afternoon';
                    else tz = 'night';
                    setTimeZone(tz);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (tab === 'home' && !action) {
                    const stage = getStage(data.day);
                    if (stage === 'egg') setBubbleText("꼬물꼬물...");
                    else if (data.isSick) setBubbleText("콜록콜록... 휴식이나 약이 필요해 🤒");
                    else if (data.fatigue >= 80) setBubbleText("너무 피곤해요... 😵");
                    else {
                        const msgs = {
                            dawn: ['새벽 공기가 차가워요', '아직 안 자고 있나요?', '고요한 새벽...'],
                            morning: ['좋은 아침!', '오늘도 파이팅', '기지개 쫙~'],
                            afternoon: ['집중 집중!', '오후도 힘내자', '할일 체크했어?'],
                            night: ['이제 잘 시간이야', '안 자?', '피곤해진다~']
                        };
                        const arr = msgs[timeZone];
                        setBubbleText(arr[Math.floor(Math.random() * arr.length)]);
                    }
                }
            }, [tab, action, timeZone, data.isSick, data.fatigue, data.day]);

            useEffect(() => {
                localStorage.setItem('todotchi_save', JSON.stringify(data));
            }, [data]);

            useEffect(() => {
                const checkMidnight = () => {
                    const todayStr = new Date().toDateString();
                    if (data.lastDate !== todayStr && !data.firstPlay && !ending && data.day <= MAX_DAYS) {
                        processMidnightDayChange();
                    }
                };
                checkMidnight();
                const timer = setInterval(checkMidnight, 30000);
                return () => clearInterval(timer);
            }, [data.lastDate, data.firstPlay, ending, data.day, data]);

            useEffect(() => { baseZoomRef.current = calZoom; }, [calZoom]);
            useEffect(() => {
                const el = calRef.current;
                if (!el) return;

                let pinchStartDist = 0;

                const onWheel = (e) => {
                    if (e.ctrlKey) {
                        e.preventDefault();
                        setCalZoom(z => Math.min(Math.max(0.7, z - e.deltaY * 0.005), 3));
                    }
                };

                const onTouchStart = (e) => {
                    if (e.touches.length === 2) {
                        pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    }
                };

                const onTouchMove = (e) => {
                    if (e.touches.length === 2 && pinchStartDist > 0) {
                        e.preventDefault();
                        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        const scale = dist / pinchStartDist;
                        setCalZoom(Math.min(Math.max(0.7, baseZoomRef.current * scale), 3));
                    }
                };

                const onTouchEnd = (e) => {
                    if (e.touches.length < 2) pinchStartDist = 0;
                };

                el.addEventListener('wheel', onWheel, { passive: false });
                el.addEventListener('touchstart', onTouchStart, { passive: false });
                el.addEventListener('touchmove', onTouchMove, { passive: false });
                el.addEventListener('touchend', onTouchEnd);

                return () => {
                    el.removeEventListener('wheel', onWheel);
                    el.removeEventListener('touchstart', onTouchStart);
                    el.removeEventListener('touchmove', onTouchMove);
                    el.removeEventListener('touchend', onTouchEnd);
                };
            }, [todoTab, tab]);

            const generateDailyMission = () => DAILY_MISSIONS[Math.floor(Math.random() * DAILY_MISSIONS.length)];
            
            const processMidnightDayChange = () => {
                setData(prev => {
                    let next = { ...prev, lastDate: new Date().toDateString(), randomEvent: null };
                    
                    // 🌟 위대한 영웅을 위한 일일 2개 미만 완료 체크 🌟
                    if ((prev.todayCompletedCount || 0) < 2) {
                        next.failedDailyMinTasks = true;
                    }
                    next.todayCompletedCount = 0;

                    const completedTodos = prev.todos.filter(t => t.isDone);
                    const uncompleted = prev.todos.length - completedTodos.length;
                    
                    let penalty = uncompleted * 5;
                    if (uncompleted >= 2 || next.fatigue >= 90 || next.stats.hap <= 20) {
                        if (Math.random() > 0.5) next.isSick = true;
                    }
                    if (penalty > 0) next.stats.hap = Math.max(0, next.stats.hap - penalty);

                    const isComboMaintained = next.dailyMissionCompleted || (next.todos.length > 0 && uncompleted === 0);
                    if (isComboMaintained) {
                        next.combo += 1;
                        next.bestCombo = Math.max(next.bestCombo, next.combo);
                        if (next.combo % 3 === 0) next.coins += 50;
                    } else if (next.todos.length > 0 || next.dailyMission) {
                        next.combo = 0;
                    }

                    const dayLogs = [];
                    let sumStats = { int:0, str:0, emo:0, soc:0, life:0, dil:0, hap:0 };

                    completedTodos.forEach(t => {
                        const eff = CATEGORIES[t.category];
                        const effStrs = [];
                        if (eff) {
                            Object.keys(eff).forEach(k => {
                                if (k !== 'fatigue' && STAT_NAMES[k]) {
                                    sumStats[k] = (sumStats[k] || 0) + eff[k];
                                    effStrs.push(`${STAT_NAMES[k]} +${eff[k]}`);
                                }
                            });
                            dayLogs.push(`✔️ [${t.category}] ${t.title} (${effStrs.join(', ')})`);
                        }
                    });

                    const checkedHabits = prev.habits.filter(h => h.checkedToday);
                    checkedHabits.forEach(h => {
                        sumStats.dil = (sumStats.dil || 0) + 1;
                        dayLogs.push(`🔄 [습관] ${h.title} 체크 (성실 +1)`);
                    });

                    if (prev.dailyMissionCompleted && prev.dailyMission) {
                        dayLogs.push(`🌟 [미션] ${prev.dailyMission.title} 완료!`);
                    }

                    let habitResults = [];
                    let newHabits = [];
                    next.habits.forEach(h => {
                        const nextPassed = h.passedDays + 1;
                        if (nextPassed >= h.goalDays) {
                            const successRate = h.checkedCount / h.goalDays;
                            if (successRate >= 0.7) {
                                habitResults.push({ name: h.title, status: 'success' });
                                Object.keys(next.stats).forEach(k => { 
                                    if(k!=='fatigue') {
                                        next.stats[k] = Math.min(100, next.stats[k] + 2); 
                                        sumStats[k] = (sumStats[k] || 0) + 2;
                                    }
                                });
                                next.coins += 100;
                                dayLogs.push(`🎉 [목표달성] ${h.title} (모든 스탯 +2, 100G)`);
                            } else {
                                habitResults.push({ name: h.title, status: 'fail' });
                            }
                        } else {
                            newHabits.push({ ...h, passedDays: nextPassed, checkedToday: false });
                        }
                    });
                    next.habits = newHabits;

                    if (Math.random() < 0.3) {
                        const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
                        ev.apply(next);
                        next.randomEvent = ev;
                    }

                    const prevStage = getStage(next.day);
                    next.day += 1;
                    const nextStage = getStage(next.day);
                    
                    if (prevStage !== nextStage && next.day <= MAX_DAYS) {
                        next.showEvolution = nextStage;
                        if (nextStage === 'child') {
                            const { int, str, emo, soc, life, dil } = next.stats;
                            const maxStat = Math.max(int, str, emo, soc, life, dil);
                            if (maxStat < 30) next.charType = 'normal';
                            else if (maxStat === int) next.charType = 'smart';
                            else if (maxStat === str) next.charType = 'macho';
                            else if (maxStat === emo) next.charType = 'emo';
                            else if (maxStat === soc) next.charType = 'social';
                            else next.charType = 'normal';
                        }
                    }

                    next.todos = next.todos.filter(t => !t.isDone); 
                    next.dailyMission = generateDailyMission();
                    next.dailyMissionCompleted = false;
                    next.dailyMissionProgress = 0;

                    const praises = [
                        "오늘 하루도 정말 알차게 보냈네요! 대단해요 👏",
                        "꾸준히 노력하는 모습이 멋져요! ✨",
                        "오늘 흘린 땀방울이 내일의 성장을 만들 거예요 💪",
                        "작은 실천들이 모여 큰 변화를 이뤄내고 있어요 🌱",
                        "스스로와의 약속을 지켜낸 당신, 최고예요! 🏆"
                    ];
                    let praise = "";
                    if (dayLogs.length === 0) {
                        praise = "오늘은 푹 쉬었군요! 푹 쉰 만큼 내일은 더 활기차게 시작해봐요 🛌💤";
                    } else {
                        praise = praises[Math.floor(Math.random() * praises.length)];
                    }

                    const totalGrowthStr = Object.entries(sumStats)
                        .filter(([k, v]) => v > 0)
                        .map(([k, v]) => `${STAT_NAMES[k]} +${v}`)
                        .join(', ');

                    setSummaryData({ 
                        day: prev.day, 
                        penalty, 
                        combo: next.combo, 
                        habitResults, 
                        event: next.randomEvent,
                        dayLogs,
                        totalGrowthStr,
                        praise
                    });
                    
                    if (next.day > MAX_DAYS) {
                        setTimeout(() => triggerEnding(next), 0);
                    } else {
                        setTimeout(() => { setShowSummary(true); triggerFeedback(penalty > 0 ? 'penalty' : 'success'); }, 0);
                    }
                    
                    return next;
                });
            };

            const triggerEnding = (finalData) => {
                const matchedEnding = ENDINGS.find(e => e.condition(finalData.stats, finalData.actionCounts, finalData)) || ENDINGS[ENDINGS.length - 1];
                setEnding(matchedEnding);
                
                if (!finalData.encyclopedia.some(e => e.id === matchedEnding.id)) {
                    finalData.encyclopedia.push({ ...matchedEnding, date: new Date().toDateString(), stats: finalData.stats });
                }
                setData(finalData);
            };

            const addTodo = () => {
                if (!newTodoTitle.trim()) return;
                triggerFeedback('click');
                setData(prev => ({
                    ...prev,
                    totalCreatedTodos: (prev.totalCreatedTodos || 0) + 1,
                    todos: [{ id: Date.now().toString(), title: newTodoTitle, category: newTodoCat, isDone: false }, ...prev.todos]
                }));
                setNewTodoTitle('');
            };

            const deleteTodo = (id) => {
                triggerFeedback('click');
                setData(prev => ({ 
                    ...prev, 
                    hasDeletedTodo: true,
                    todos: prev.todos.filter(t => t.id !== id) 
                }));
            };

            const openEditTodo = (t) => {
                setEditingTodoId(t.id);
                setEditTodoTitle(t.title);
                setEditTodoCat(t.category);
            };

            const saveEditTodo = () => {
                if(!editTodoTitle.trim()) return;
                triggerFeedback('click');
                setData(prev => ({
                    ...prev,
                    todos: prev.todos.map(t => t.id === editingTodoId ? { ...t, title: editTodoTitle, category: editTodoCat } : t)
                }));
                setEditingTodoId(null);
            };

            const addHabit = () => {
                if (!habitTitle.trim()) return;
                triggerFeedback('click');
                setData(prev => ({
                    ...prev,
                    habits: [...prev.habits, { id: Date.now().toString(), title: habitTitle, goalDays: habitGoal, category: habitCat, passedDays: 0, checkedCount: 0, checkedToday: false }]
                }));
                setHabitTitle(''); setShowHabitModal(false);
            };

            const completeTodo = (id) => {
                triggerFeedback('coin');
                setIsAnimating(true); 
                setTimeout(() => setIsAnimating(false), 500);

                setData(prev => {
                    const todo = prev.todos.find(t => t.id === id);
                    if (!todo || todo.isDone) return prev;

                    let next = { 
                        ...prev, 
                        stats: { ...prev.stats }, 
                        actionCounts: { ...prev.actionCounts },
                        todos: prev.todos.map(t => t.id === id ? { ...t, isDone: true } : t),
                        todayCompletedCount: (prev.todayCompletedCount || 0) + 1 // 🌟 완료 카운트 증가
                    };
                    
                    next.coins += 10;
                    
                    const cat = todo.category;
                    const eff = CATEGORIES[cat];
                    next.actionCounts[cat] = (next.actionCounts[cat] || 0) + 1;
                    
                    Object.keys(eff).forEach(k => {
                        if (k === 'fatigue') {
                            next.fatigue = Math.max(0, Math.min(100, next.fatigue + eff.fatigue));
                        } else {
                            next.stats[k] = Math.min(100, next.stats[k] + eff[k]);
                        }
                    });

                    let newAction = null;
                    
                    if (next.isSick && (cat === '휴식' || /약|병원|치유|회복/.test(todo.title))) {
                        next.isSick = false;
                        newAction = 'heal';
                    } else {
                        if (/[밥식사먹기간식쌀]/.test(todo.title) || todo.title.includes('먹기')) newAction = 'eat';
                        else if (/[씻목욕욕실샤워세안세수]/.test(todo.title) || todo.title.includes('씻기')) newAction = 'wash';
                        else if (/[잠취침졸려자기수면]/.test(todo.title)) newAction = 'sleep';
                        else if (/[공부독서인강과제숙제책]/.test(todo.title)) newAction = 'study';
                    }

                    let missionCompletedNow = false;
                    if (next.dailyMission && !next.dailyMissionCompleted) {
                        const dm = next.dailyMission;
                        if (dm.id === 'm1' || (dm.id === 'm2' && cat === '공부') || (dm.id === 'm3' && cat === '운동') || (dm.id === 'm4' && cat === '휴식')) {
                            next.dailyMissionProgress = (next.dailyMissionProgress || 0) + 1;
                            if (next.dailyMissionProgress >= dm.target) {
                                next.dailyMissionCompleted = true;
                                missionCompletedNow = true;
                                dm.onComplete(next);
                            }
                        }
                    }

                    if (newAction || missionCompletedNow) {
                        setTimeout(() => {
                            if (missionCompletedNow) playSound('success');
                            if (newAction) setAction(newAction);
                            if (window.actionTimer) clearTimeout(window.actionTimer);
                            window.actionTimer = setTimeout(() => setAction(null), 5000);
                            setTab('home');
                        }, 0);
                    }

                    return next;
                });
            };

            const checkHabit = (id) => {
                triggerFeedback('success');
                setIsAnimating(true); 
                setTimeout(() => setIsAnimating(false), 500);

                setData(prev => {
                    const habit = prev.habits.find(x => x.id === id);
                    if (!habit || habit.checkedToday) return prev;

                    let next = { 
                        ...prev, 
                        stats: { ...prev.stats },
                        habits: prev.habits.map(x => x.id === id ? { ...x, checkedCount: x.checkedCount + 1, checkedToday: true } : x)
                    };
                    
                    next.stats.dil = Math.min(100, next.stats.dil + 1);
                    next.coins += 5;

                    let missionCompletedNow = false;
                    if (next.dailyMission && next.dailyMission.id === 'm5' && !next.dailyMissionCompleted) {
                        next.dailyMissionProgress = (next.dailyMissionProgress || 0) + 1;
                        next.dailyMissionCompleted = true;
                        missionCompletedNow = true;
                        next.dailyMission.onComplete(next);
                    }

                    if (missionCompletedNow) {
                        setTimeout(() => {
                            playSound('success');
                            setTab('home');
                        }, 0);
                    }

                    return next;
                });
            };

            const buyItem = (item) => {
                if (data.coins < item.price) return alert('코인이 부족합니다.');
                if (data.inventory.some(i => i.id === item.id) || data.equippedItems.some(i => i.id === item.id)) return alert('이미 보유중입니다.');
                triggerFeedback('coin');
                setData(prev => ({ ...prev, coins: prev.coins - item.price, inventory: [...prev.inventory, item] }));
            };

            const toggleEquip = (item) => {
                triggerFeedback('click');
                setData(prev => {
                    const isEquipped = prev.equippedItems.some(i => i.id === item.id);
                    if (isEquipped) {
                        return { ...prev, equippedItems: prev.equippedItems.filter(i => i.id !== item.id), inventory: [...prev.inventory, item] };
                    } else {
                        return { ...prev, inventory: prev.inventory.filter(i => i.id !== item.id), equippedItems: [...prev.equippedItems, item] };
                    }
                });
            };

            const hardReset = () => {
                if (window.confirm('정말 모든 데이터를 삭제하시겠습니까? 복구할 수 없습니다.')) {
                    localStorage.removeItem('todotchi_save');
                    window.location.reload();
                }
            };
            
            const exportSave = () => {
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'todotchi_save.json'; a.click();
            };

            const importSave = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try { const parsed = JSON.parse(ev.target.result); if(parsed.version) { setData(parsed); alert('복원 성공!'); } } 
                    catch(err) { alert('잘못된 파일입니다.'); }
                };
                reader.readAsText(file);
            };

            const prevMonthBtn = () => {
                triggerFeedback('click');
                if (calMonth === 1) { setCalMonth(12); setCalYear(y => y - 1); }
                else { setCalMonth(m => m - 1); }
            };
            const nextMonthBtn = () => {
                triggerFeedback('click');
                if (calMonth === 12) { setCalMonth(1); setCalYear(y => y + 1); }
                else { setCalMonth(m => m + 1); }
            };

            const isEditableDate = (dateStr) => {
                if (!data.gameStartDate || ending || data.day > MAX_DAYS) return false;
                const targetDate = new Date(dateStr);
                const startDate = new Date(data.gameStartDate);
                const diffDays = Math.floor((targetDate - startDate) / (1000 * 60 * 60 * 24));
                return diffDays >= 0 && diffDays < MAX_DAYS; 
            };

            const openCalModal = (d, mode) => {
                const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                setSelectedCalDate(dateStr);
                setCalEventEndDate(dateStr);
                setCalEventTitle('');
                setCalModalMode(mode);
            };

            const touchTimerRef = useRef(null);
            const isPressFiredRef = useRef(false);

            const onCellPointerDown = (e, d) => {
                if(!d) return;
                isPressFiredRef.current = false;
                touchTimerRef.current = setTimeout(() => {
                    isPressFiredRef.current = true;
                    triggerFeedback('success'); 
                    openCalModal(d, 'add');
                }, 500);
            };

            const onCellPointerUp = () => {
                if(touchTimerRef.current) clearTimeout(touchTimerRef.current);
            };

            const onCellClick = (e, d) => {
                if(!d || isPressFiredRef.current) return;
                triggerFeedback('click');
                openCalModal(d, 'view');
            };

            const onCellDoubleClick = (e, d) => {
                if(!d) return;
                if(touchTimerRef.current) clearTimeout(touchTimerRef.current);
                triggerFeedback('click');
                openCalModal(d, 'add');
            };

            const addCalEvent = () => {
                if(!calEventTitle.trim()) return;
                if(calEventEndDate < selectedCalDate) {
                    alert("종료일은 시작일보다 빠를 수 없습니다."); return;
                }
                triggerFeedback('click');
                setData(prev => ({
                    ...prev,
                    calendarEvents: [...prev.calendarEvents, {
                        id: Date.now().toString(),
                        title: calEventTitle,
                        startDate: selectedCalDate,
                        endDate: calEventEndDate,
                        color: calEventColor
                    }]
                }));
                setCalEventTitle('');
            };

            const deleteCalEvent = (id) => {
                triggerFeedback('click');
                setData(prev => ({
                    ...prev,
                    calendarEvents: prev.calendarEvents.filter(ev => ev.id !== id)
                }));
            };

            const firstDayOfMonth = new Date(calYear, calMonth - 1, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth, 0).getDate();
            const calCells = [];
            for(let i=0; i<firstDayOfMonth; i++) calCells.push(null);
            for(let i=1; i<=daysInMonth; i++) calCells.push(i);
            while(calCells.length % 7 !== 0) calCells.push(null);

            if (data.firstPlay) {
                return (
                    <div className="screen-bezel theme-morning"><div className="lcd-screen" style={{ padding: '20px', textAlign: 'center', justifyContent: 'center' }}>
